:root {
  --paper:#ffffff; --ink:#101820; --ink-2:#47525e; --muted:#636d79; --line:#e4e7ea; --wash:#f4f5f7; --grid:#f1f2f4;
  --warm:#c44a33; --cool:#337266; --track:#808a95;
  --t-12:12px; --t-14:14px; --t-17:17px; --t-22:22px; --t-30:30px;
  --s-4:4px; --s-8:8px; --s-12:12px; --s-16:16px; --s-24:24px; --s-32:32px; --s-48:48px;
  --r-2:2px; --r-6:6px; --d-fast:.16s; --d-mid:.28s; --d-slow:.56s; --ease:cubic-bezier(.2,.7,.2,1);
  --sans:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; --num:"N-Inter",var(--sans);
  --up:var(--warm); --down:var(--cool); color-scheme: light; }
:root[data-ud="green"] { --up:var(--cool); --down:var(--warm); }
:root[data-theme="dark"] { --paper:#0e131a; --ink:#e9edf2; --ink-2:#b3bcc7; --muted:#7f8a97; --line:#222b36; --wash:#161d27; --grid:#18202a; --warm:#e56a4f; --cool:#58ab99; --track:#5f6a77; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: var(--t-14); line-height: 1.45; -webkit-font-smoothing: antialiased; transition: background var(--d-mid), color var(--d-mid); }
h1, h2, h3, p, figure { margin: 0; }
button, input { font: inherit; color: inherit; } button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
td, .n { font-family: var(--num); font-variant-numeric: tabular-nums; }
.skip { position: absolute; left: var(--s-16); top: -48px; z-index: 20; padding: var(--s-8) var(--s-12); border-radius: var(--r-6); background: var(--ink); color: var(--paper); text-decoration: none; } .skip:focus { top: var(--s-8); }
.bar-in, .band-in, .wrap { max-width: 1360px; margin: 0 auto; padding-left: var(--s-24); padding-right: var(--s-24); }
.bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; gap: var(--s-16); padding-top: var(--s-4); padding-bottom: var(--s-4); }
.brand { padding: var(--s-8) 0; font-weight: 600; color: var(--ink); text-decoration: none; white-space: nowrap; }
.sitenav { display: flex; gap: var(--s-16); white-space: nowrap; } .sitenav a { padding: var(--s-8) 0; color: var(--muted); text-decoration: none; transition: color var(--d-fast); } .sitenav a:hover, .sitenav a[aria-current] { color: var(--ink); }
.find { position: relative; flex: 1; max-width: 320px; }
.find input { width: 100%; height: 32px; padding: 0 var(--s-12); border: 1px solid var(--track); border-radius: var(--r-6); background: var(--wash); } .find input::placeholder { color: var(--muted); }
.sug { position: absolute; left: 0; right: 0; top: 38px; margin: 0; padding: var(--s-4); list-style: none; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-6); box-shadow: 0 12px 32px rgba(0,0,0,.14); max-height: 300px; overflow: auto; }
.sug li { display: flex; justify-content: space-between; gap: var(--s-12); padding: var(--s-8) var(--s-12); border-radius: var(--r-2); cursor: pointer; } .sug li[aria-selected="true"], .sug li:hover { background: var(--wash); } .sug small { overflow: hidden; color: var(--muted); font-size: var(--t-12); text-overflow: ellipsis; white-space: nowrap; }
.sug li.none { cursor: default; color: var(--muted); } .sug li.none:hover { background: none; }
.gap { margin-left: auto; }
.mode { height: 32px; padding: 0 var(--s-12); border: 1px solid var(--line); border-radius: var(--r-6); background: none; color: var(--ink-2); white-space: nowrap; transition: border-color var(--d-fast); } .mode:hover { border-color: var(--track); }

/* 抬头：截至日期，下面一排宏观读数 */
.band { background: var(--wash); border-bottom: 1px solid var(--line); }
.head { padding: var(--s-16) 0 var(--s-16); }
.head h1 { font-size: var(--t-30); font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.head .sec { margin-top: var(--s-4); color: var(--muted); }
.say { max-width: 46em; margin-top: var(--s-12); font-family: var(--num); font-size: var(--t-22); font-weight: 600; line-height: 1.3; font-variant-numeric: lining-nums proportional-nums; }
.kv { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0 var(--s-24); border-top: 1px solid var(--line); }
.kv div { padding: var(--s-12) 0; }
.kv span { display: block; color: var(--muted); font-size: var(--t-12); }
.kv b { display: flex; align-items: center; gap: var(--s-8); font-family: var(--num); font-size: var(--t-17); font-weight: 500; line-height: 1.5; font-variant-numeric: lining-nums proportional-nums; white-space: nowrap; }
.kv b small { color: var(--muted); font-family: var(--sans); font-size: var(--t-12); font-weight: 400; }
.kv em { display: block; color: var(--ink-2); font-size: var(--t-12); font-style: normal; line-height: 1.5; }
.kv svg { flex: none; overflow: visible; }
.lk { padding: var(--s-12) 0 var(--s-16); border-top: 1px solid var(--line); color: var(--ink-2); } .lk b { font-family: var(--num); font-weight: 600; color: var(--ink); }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--s-32) var(--s-48); margin-top: var(--s-32); }
.p { min-width: 0; } .c7 { grid-column: span 7; } .c5 { grid-column: span 5; }
.p > header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s-8) var(--s-12); min-height: 40px; padding-bottom: var(--s-8); margin-bottom: var(--s-12); border-bottom: 1px solid var(--line); }
.p > header.sub { margin-top: var(--s-24); }
.p h2 { font-size: var(--t-14); font-weight: 600; } .p h2 small { margin-left: var(--s-8); font-size: var(--t-12); font-weight: 400; color: var(--muted); }
.seg { display: inline-flex; gap: 1px; padding: 2px; border-radius: var(--r-6); background: var(--wash); }
.seg button { min-height: 28px; padding: 0 var(--s-12); border: 0; border-radius: calc(var(--r-6) - 2px); background: none; color: var(--ink-2); font-size: var(--t-12); white-space: nowrap; transition: background var(--d-fast) var(--ease), color var(--d-fast); } .seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.10); }
.read { min-height: 20px; color: var(--ink-2); font-family: var(--num); font-size: var(--t-12); font-variant-numeric: tabular-nums; } .read span { margin-right: var(--s-12); white-space: nowrap; } .read b { font-weight: 500; color: var(--ink); }
.read i { display: inline-block; width: 8px; height: 8px; margin-right: var(--s-4); border-radius: 1px; vertical-align: -1px; }
#bc { position: relative; margin-top: var(--s-8); } #bc svg { display: block; width: 100%; touch-action: pan-y; } #bc text { font-family: var(--num); font-size: var(--t-12); fill: var(--muted); } #bc text.e { fill: var(--ink-2); }

table { width: 100%; border-collapse: collapse; }

  $("c-one").innerHTML = "<b>周期位置</b>政策偏紧、就业偏满两项，现在" + NAME[N.state] + (which.length ? "：" + which.join("、") : "") + "。" +
    C.eval_from.slice(0, 4) + " 年以来，" + NAME[N.state] + "的月份中，随后 12 个月内深跌（标普 500 月均值跌超 15%）占 " + s.deep + "%，全部月份占 " + C.base + "%。";
}
var qs = new URLSearchParams(location.search); if (/^(1y|5y|all)$/.test(qs.get("r") || "")) range = qs.get("r");
function safe(f) { try { f(); } catch (e) { if (window.console) console.error(e); } }
[copyRate, copyCyc, drawTbl, drawRate].forEach(safe);
var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { drawRate(); drawCards(); drawBase(); }, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawRate(); drawCards(); drawBase(); });
  })();

  /* ---------- 搜索：选中后去个股评分页 ---------- */
  (function () {
    var q = $("q"), sug = $("sug"), list = [], sel = -1;
    function go(t) { location.href = "index.html#" + encodeURIComponent(t); }
    function draw() {
      sug.textContent = ""; sug.hidden = !q.value.trim(); q.setAttribute("aria-expanded", String(!sug.hidden)); if (sug.hidden) return;
      if (!list.length) { sug.appendChild(el("li", "none", "没有找到，试试股票代码")); return; }
      list.forEach(function (p, i) { var li = el("li", null, p[0]); li.setAttribute("role", "option"); li.setAttribute("aria-selected", String(i === sel)); li.appendChild(el("small", null, p[1])); li.onmousedown = function (e) { e.preventDefault(); go(p[0]); }; sug.appendChild(li); });
    }
    q.oninput = function () {
      var v = q.value.trim().toUpperCase(); sel = -1;
      list = !v ? [] : D.tk.filter(function (p) { return p[0].indexOf(v) === 0; }).concat(D.tk.filter(function (p) { return p[0].indexOf(v) !== 0 && p[1].toUpperCase().indexOf(v) >= 0; })).slice(0, 8);
      draw();
    };
    q.onkeydown = function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { if (!list.length) return; e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + list.length) % list.length; draw(); }
      else if (e.key === "Enter" && list.length) go(list[Math.max(0, sel)][0]);
      else if (e.key === "Escape") { q.value = ""; list = []; draw(); }
    };
    q.onblur = function () { sug.hidden = true; q.setAttribute("aria-expanded", "false"); };
  })();
})();
